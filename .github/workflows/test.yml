name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          bash --version | head -1
          git --version
          python3 --version

      - name: Run test suites
        run: |
          status=0
          for t in tests/*.test.sh; do
            echo "=== $t"
            bash "$t" || status=1
          done
          exit $status

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck --severity=warning install.sh bin/*.sh tests/*.sh
